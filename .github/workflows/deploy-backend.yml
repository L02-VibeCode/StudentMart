name: Deploy backend to VPS
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        type: boolean
        default: false
        description: 'Apply reviewed DB migrations (requires backup confirmation)'
      backup_confirmed:
        type: boolean
        default: false
        description: 'Operator confirms a tested backup/restore plan exists'

permissions:
  contents: read
concurrency:
  group: production-backend
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main and configured environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/environments/production-backend" > "$RUNNER_TEMP/environment.json"
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0' "$RUNNER_TEMP/environment.json" >/dev/null
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate VPS configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          APPLY: ${{ inputs.apply_migrations }}
          BACKUP: ${{ inputs.backup_confirmed }}
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] && ((VPS_PORT > 0 && VPS_PORT <= 65535))
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          if [[ "$APPLY" == true ]]; then test "$BACKUP" = true; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set immutable commit image tag
        id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}
      - name: Install reviewed Compose/script and deploy pinned digest
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          IMAGE: ${{ steps.image.outputs.tag }}@${{ steps.build.outputs.digest }}
          APPLY: ${{ inputs.apply_migrations }}
          BACKUP: ${{ inputs.backup_confirmed }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/vps-known-hosts"
          trap 'rm -f "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/vps-known-hosts"' EXIT
          options=(-i "$RUNNER_TEMP/vps-key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts")
          scp -P "$VPS_PORT" "${options[@]}" infra/compose.production.yml scripts/deploy/backend.sh "$VPS_USER@$VPS_HOST:/opt/studentmart/"
          ssh -p "$VPS_PORT" "${options[@]}" "$VPS_USER@$VPS_HOST" "bash /opt/studentmart/backend.sh '$IMAGE' '$APPLY' '$BACKUP'"
