name: Build mobile production on EAS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-mobile
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main and configured environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/environments/production-mobile" > "$RUNNER_TEMP/environment.json"
          jq -e '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0' "$RUNNER_TEMP/environment.json" >/dev/null
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-mobile
    env:
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
      IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          cache: true
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Require real production project and HTTPS API origin
        run: node scripts/ci/check-eas-config.cjs --prepare
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 27.10.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android and iOS (no store submission)
        working-directory: mobile
        run: eas build --platform all --profile production --non-interactive --wait
