# Các vai trò được chọn theo công việc; không bật chạy đội tự động.
[shell_environment_policy]
inherit = "core"

[agents.pm]
description = "Sản phẩm, evidence, phạm vi và nghiệm thu StudentMart."
config_file = "agents/pm.toml"

[agents.tech-lead]
description = "Thiết kế kiến trúc, dữ liệu, API và phân quyền StudentMart."
config_file = "agents/tech-lead.toml"

[agents.backend-dev]
description = "Backend Node.js/PostgreSQL và quy tắc nghiệp vụ StudentMart."
config_file = "agents/backend-dev.toml"

[agents.frontend-dev]
description = "Mobile React Native + Expo cho StudentMart."
config_file = "agents/frontend-dev.toml"

[agents.qa-engineer]
description = "Kiểm thử nghiệp vụ, tích hợp và thiết bị thật StudentMart."
config_file = "agents/qa-engineer.toml"
